<aside
  class="side"
  [class.side--collapsed]="collapsed()"
  [class.side--mobile-open]="mobileOpen()"
>
  <div class="side__head">
    <a class="side__brand" routerLink="/app/dashboard" (click)="closeMobile.emit()" aria-label="WaslX home">
      <span class="side__logo"><img src="/logo.png" alt="" /></span>
      <span class="side__brandcopy">
        <strong>{{ brandName() }}</strong>
        <span>{{ brandSubtitle() }}</span>
      </span>
    </a>
  </div>

  <!-- Always-available collapse / expand toggle on the sidebar edge -->
  <button
    class="side__toggle"
    type="button"
    (click)="toggleCollapsed.emit()"
    [attr.aria-label]="collapseLabel()"
    [attr.title]="collapseLabel()"
  >
    <app-icon name="chevron-left" [size]="15" />
  </button>

  <nav class="side__nav" aria-label="Primary">
    @for (group of groups(); track group.id) {
      <div class="side__group">
        <span class="side__grouplabel">{{ group.label }}</span>
        <div class="side__items">
          @for (item of group.items; track item.id) {
            <a
              *appHasRole="item.roles"
              class="side__item"
              [routerLink]="item.routerLink"
              routerLinkActive="is-active"
              (click)="closeMobile.emit()"
              [attr.title]="item.label"
            >
              <span class="side__ico" aria-hidden="true">
                <app-icon [name]="item.icon" [size]="18" />
              </span>
              <span class="side__label">{{ item.label }}</span>
              @if (item.routerLink === '/app/inbox') {
                <span class="side__badge" [class.side__badge--off]="!channelLive()">{{ channelBadgeLabel() }}</span>
              } @else if (item.badge) {
                <span class="side__badge">{{ item.badge }}</span>
              }
            </a>
          }
        </div>
      </div>
    }
  </nav>
</aside>
