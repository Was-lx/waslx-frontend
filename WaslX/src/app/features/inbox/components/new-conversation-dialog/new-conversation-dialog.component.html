@if (open) {
  <div class="ncd" [attr.dir]="direction()" (click)="onBackdrop($event)">
    <div class="ncd__card" role="dialog" aria-modal="true">
      <div class="ncd__head">
        <div>
          <h3 class="ncd__title">{{ t('newConvTitle') }}</h3>
          <p class="ncd__sub">{{ t('newConvSubtitle') }}</p>
        </div>
        <button type="button" class="ncd__close" (click)="onClose()" [attr.aria-label]="t('newConvCancel')">
          <app-icon name="x" [size]="18" />
        </button>
      </div>

      <div class="ncd__body">
        <div class="ncd__row">
          <div class="ui-field ncd__cc">
            <label class="ui-label" for="ncd-cc">{{ t('newConvCountry') }}</label>
            <select id="ncd-cc" class="ui-select" [value]="dialCode()" (change)="onDialChange($any($event.target).value)">
              @for (c of dialCodes; track c.code) {
                <option [value]="c.code">{{ c.name }} (+{{ c.code }})</option>
              }
            </select>
          </div>
          <div class="ui-field ncd__num">
            <label class="ui-label" for="ncd-phone">{{ t('newConvPhone') }}</label>
            <input
              id="ncd-phone"
              type="tel"
              class="ui-input"
              [value]="localNumber()"
              (input)="onNumberInput($any($event.target).value)"
              [placeholder]="t('newConvPhonePh')"
              autocomplete="off"
            />
          </div>
        </div>
        <span class="ncd__hint">{{ t('newConvHint') }}: <strong dir="ltr">+{{ fullPhone() }}</strong></span>

        <div class="ui-field">
          <label class="ui-label" for="ncd-tpl">{{ t('newConvTemplate') }}</label>
          @if (_templates().length === 0) {
            <span class="ncd__muted">{{ t('newConvNoTemplates') }}</span>
          } @else {
            <select
              id="ncd-tpl"
              class="ui-select"
              [value]="templateName() ?? ''"
              (change)="onTemplateChange($any($event.target).value)"
            >
              <option value="" disabled>{{ t('newConvTemplatePh') }}</option>
              @for (tpl of _templates(); track tpl.id) {
                <option [value]="tpl.name">{{ tpl.name }} ({{ tpl.language }})</option>
              }
            </select>
          }
        </div>

        @if (selectedTemplate()?.bodyText; as body) {
          <div class="ncd__preview"><p>{{ body }}</p></div>
        }

        @if (error()) {
          <span class="ui-error ncd__error">{{ error() }}</span>
        }
      </div>

      <div class="ncd__foot">
        <button type="button" class="ui-btn ui-btn--ghost" (click)="onClose()" [disabled]="sending">
          {{ t('newConvCancel') }}
        </button>
        <button
          type="button"
          class="ui-btn ui-btn--primary"
          (click)="submit()"
          [disabled]="sending || _templates().length === 0"
        >
          @if (sending) {
            <span class="ui-spinner"></span> {{ t('newConvSending') }}
          } @else {
            <app-icon name="send" [size]="16" /> {{ t('newConvSend') }}
          }
        </button>
      </div>
    </div>
  </div>
}
