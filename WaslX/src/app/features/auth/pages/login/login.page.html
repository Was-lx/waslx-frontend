<main class="login" dir="ltr">
  <section class="login__card" [attr.dir]="direction()">
    <div class="login__hero">
      <a routerLink="/" class="login__brand">
        <span class="login__brand-mark">
          <img src="/logo.png" alt="" />
        </span>
        <div>
          <h1>{{ t('loginTitle') }}</h1>
        </div>
      </a>

      <p class="login__lead">{{ t('loginLead') }}</p>
    </div>

    <form class="login__form" [formGroup]="loginForm" (ngSubmit)="signIn()" novalidate>
      <label class="login__field">
        <span>{{ t('emailAddress') }}</span>
        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          inputmode="email"
          [attr.aria-invalid]="controlInvalid('email')"
          [attr.aria-describedby]="emailHelpId"
        />
        @if (controlInvalid('email')) {
        <small [id]="emailHelpId">{{ emailErrorMessage() }}</small>
        }
      </label>

      <label class="login__field">
        <span>{{ t('password') }}</span>
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="controlInvalid('password')"
          [attr.aria-describedby]="passwordHelpId"
        />
        @if (controlInvalid('password')) {
        <small [id]="passwordHelpId">{{ passwordErrorMessage() }}</small>
        }
      </label>

      @if (errorMessage()) {
      <p class="login__error" role="alert">{{ errorMessage() }}</p>
      } @if (lockoutMessage()) {
      <p class="login__error" role="alert">
        {{ lockoutMessage() }}
        <br />
        <a
          routerLink="/login/forgot-password"
          class="login__link"
          style="display: inline-block; margin-top: 8px"
        >
          {{ t('forgotPasswordTitle') || 'Forgot Password?' }}
        </a>
      </p>
      }

      <div class="login__actions">
        <button
          type="submit"
          class="login__primary"
          [disabled]="submitting() || !!lockoutMessage()"
        >
          {{ submitting() ? t('signingIn') : t('signIn') }}
        </button>
      </div>

      <div class="login__meta">
        <button
          type="button"
          class="login__link"
          (click)="toggleLanguage()"
          [disabled]="submitting()"
        >
          {{ languageLabel() }}
        </button>
        <button type="button" class="login__link" (click)="toggleTheme()" [disabled]="submitting()">
          {{ t('toggleTheme') }}
        </button>
      </div>

      <div class="login__meta" style="margin-top: 0">
        <a routerLink="/login/forgot-password" class="login__link">
          {{ t('forgotPasswordTitle') || 'Forgot Password?' }}
        </a>
      </div>
    </form>

    <p class="login__hint">{{ t('noAccount') }}</p>
  </section>
</main>
