<app-auth-shell>
  <div class="auth-head">
    <h1 class="auth-title">{{ t('loginTitle') }}</h1>
    <p class="auth-lead">{{ t('loginLead') }}</p>
  </div>

  <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="signIn()" novalidate>
    <label class="auth-field">
      <span>{{ t('emailAddress') }}</span>
      <input
        class="auth-input"
        type="email"
        formControlName="email"
        autocomplete="email"
        inputmode="email"
        placeholder="you@company.com"
        [attr.aria-invalid]="controlInvalid('email')"
        [attr.aria-describedby]="emailHelpId"
      />
      @if (controlInvalid('email')) {
        <small class="auth-err" [id]="emailHelpId">{{ emailErrorMessage() }}</small>
      }
    </label>

    <label class="auth-field">
      <span>{{ t('password') }}</span>
      <span class="auth-inputWrap">
        <input
          class="auth-input"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          placeholder="••••••••"
          [attr.aria-invalid]="controlInvalid('password')"
          [attr.aria-describedby]="passwordHelpId"
        />
        <button type="button" class="auth-reveal" (click)="togglePassword()" [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
          <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="18" />
        </button>
      </span>
      @if (controlInvalid('password')) {
        <small class="auth-err" [id]="passwordHelpId">{{ passwordErrorMessage() }}</small>
      }
    </label>

    <div class="auth-links" style="justify-content: flex-end; margin-top: -4px">
      <a routerLink="/login/forgot-password" class="auth-link">{{ t('forgotPassword') }}</a>
    </div>

    @if (errorMessage()) {
      <p class="auth-alert" role="alert">
        <app-icon name="x" [size]="16" /> {{ errorMessage() }}
      </p>
    }
    @if (lockoutMessage()) {
      <p class="auth-alert auth-alert--warn" role="alert">
        <app-icon name="lock" [size]="16" />
        <span>
          {{ lockoutMessage() }}
          <a routerLink="/login/forgot-password" class="auth-link">{{ t('forgotPassword') }}</a>
        </span>
      </p>
    }

    <button type="submit" class="auth-btn" [disabled]="submitting() || !!lockoutMessage()">
      @if (submitting()) {
        <span class="auth-spin"></span> {{ t('signingIn') }}
      } @else {
        {{ t('signIn') }} <app-icon name="arrow-right" [size]="18" />
      }
    </button>
  </form>

  <p class="auth-hint">{{ t('noAccount') }}</p>
</app-auth-shell>
