<main class="login" [attr.dir]="direction()">
  <section class="login__card">
    <div class="login__hero">
      <div class="login__brand">
        <span class="login__brand-mark">
          <img src="/logo.png" alt="" />
        </span>
        <div>
          <h1>{{ t('forgotPasswordTitle') }}</h1>
        </div>
      </div>
      <p class="login__lead">{{ t('forgotPasswordLead') }}</p>
    </div>

    <form class="login__form" [formGroup]="forgotForm" (ngSubmit)="requestReset()" novalidate>
      <label class="login__field">
        <span>{{ t('emailAddress') }}</span>
        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          inputmode="email"
          [attr.aria-invalid]="controlInvalid('email')"
          [attr.aria-describedby]="emailHelpId"
        />
        @if (controlInvalid('email')) {
        <small [id]="emailHelpId">{{ emailErrorMessage() }}</small>
        }
      </label>

      @if (errorMessage()) {
      <p class="login__error" role="alert">{{ errorMessage() }}</p>
      }

      @if (successMessage()) {
      <p class="login__success" role="alert">{{ successMessage() }}</p>
      }

      <div class="login__actions">
        <button type="submit" class="login__primary" [disabled]="submitting() || successMessage()">
          {{ submitting() ? t('sending') : t('sendResetLink') }}
        </button>
      </div>

      <div class="login__meta">
        <a routerLink="/login" class="login__link">
          &larr; {{ t('backToLogin') }}
        </a>
      </div>
    </form>
  </section>
</main>
