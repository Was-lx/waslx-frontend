<app-auth-shell>
  @if (successMessage()) {
    <div class="auth-success">
      <span class="auth-successIcon"><app-icon name="mail" [size]="28" /></span>
      <h1 class="auth-successTitle">{{ t('forgotPasswordTitle') }}</h1>
      <p class="auth-successLead">{{ successMessage() }}</p>
      <a routerLink="/login" class="auth-btn" style="text-decoration: none">
        <app-icon name="arrow-right" [size]="18" /> {{ t('backToLogin') }}
      </a>
    </div>
  } @else {
    <div class="auth-head">
      <h1 class="auth-title">{{ t('forgotPasswordTitle') }}</h1>
      <p class="auth-lead">{{ t('forgotPasswordLead') }}</p>
    </div>

    <form class="auth-form" [formGroup]="forgotForm" (ngSubmit)="requestReset()" novalidate>
      <label class="auth-field">
        <span>{{ t('emailAddress') }}</span>
        <input
          class="auth-input"
          type="email"
          formControlName="email"
          autocomplete="email"
          inputmode="email"
          placeholder="you@company.com"
          [attr.aria-invalid]="controlInvalid('email')"
          [attr.aria-describedby]="emailHelpId"
        />
        @if (controlInvalid('email')) {
          <small class="auth-err" [id]="emailHelpId">{{ emailErrorMessage() }}</small>
        }
      </label>

      @if (errorMessage()) {
        <p class="auth-alert" role="alert"><app-icon name="x" [size]="16" /> {{ errorMessage() }}</p>
      }

      <button type="submit" class="auth-btn" [disabled]="submitting()">
        @if (submitting()) {
          <span class="auth-spin"></span> {{ t('sending') }}
        } @else {
          <app-icon name="send" [size]="17" /> {{ t('sendResetLink') }}
        }
      </button>
    </form>

    <p class="auth-hint"><a routerLink="/login">{{ t('backToLogin') }}</a></p>
  }
</app-auth-shell>
