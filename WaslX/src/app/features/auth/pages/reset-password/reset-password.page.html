<app-auth-shell>
  @if (successMessage()) {
    <div class="auth-success">
      <span class="auth-successIcon"><app-icon name="check-circle" [size]="30" /></span>
      <h1 class="auth-successTitle">{{ t('resetPasswordTitle') }}</h1>
      <p class="auth-successLead">{{ successMessage() }}</p>
      <a routerLink="/login" class="auth-btn" style="text-decoration: none">
        <app-icon name="arrow-right" [size]="18" /> {{ t('backToLogin') }}
      </a>
    </div>
  } @else {
    <div class="auth-head">
      <h1 class="auth-title">{{ t('resetPasswordTitle') }}</h1>
      <p class="auth-lead">{{ t('resetPasswordLead') }}</p>
    </div>

    <form class="auth-form" [formGroup]="resetForm" (ngSubmit)="resetPassword()" novalidate>
      <label class="auth-field">
        <span>{{ t('password') }}</span>
        <span class="auth-inputWrap">
          <input
            class="auth-input"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="new-password"
            placeholder="••••••••"
            [attr.aria-invalid]="controlInvalid('password')"
            [attr.aria-describedby]="passwordHelpId"
          />
          <button type="button" class="auth-reveal" (click)="togglePassword()" [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
            <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="18" />
          </button>
        </span>
        @if (controlInvalid('password')) {
          <small class="auth-err" [id]="passwordHelpId">{{ passwordErrorMessage() }}</small>
        }
      </label>

      <label class="auth-field">
        <span>{{ t('confirmPassword') }}</span>
        <input
          class="auth-input"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="confirmPassword"
          autocomplete="new-password"
          placeholder="••••••••"
          [attr.aria-invalid]="controlInvalid('confirmPassword')"
        />
        @if (controlInvalid('confirmPassword')) {
          <small class="auth-err">{{ confirmErrorMessage() }}</small>
        }
      </label>

      @if (errorMessage()) {
        <p class="auth-alert" role="alert"><app-icon name="x" [size]="16" /> {{ errorMessage() }}</p>
      }

      <button type="submit" class="auth-btn" [disabled]="submitting()">
        @if (submitting()) {
          <span class="auth-spin"></span> {{ t('resetting') }}
        } @else {
          <app-icon name="lock" [size]="17" /> {{ t('resetPasswordAction') }}
        }
      </button>
    </form>

    <p class="auth-hint"><a routerLink="/login">{{ t('backToLogin') }}</a></p>
  }
</app-auth-shell>
