<main class="login" [attr.dir]="direction()">
  <section class="login__card">
    <div class="login__hero">
      <div class="login__brand">
        <span class="login__brand-mark">
          <img src="/logo.png" alt="" />
        </span>
        <div>
          <h1>{{ t('resetPasswordTitle') }}</h1>
        </div>
      </div>
      <p class="login__lead">{{ t('resetPasswordLead') }}</p>
    </div>

    <form class="login__form" [formGroup]="resetForm" (ngSubmit)="resetPassword()" novalidate>
      <label class="login__field">
        <span>{{ t('password') }}</span>
        <input
          type="password"
          formControlName="password"
          autocomplete="new-password"
          [attr.aria-invalid]="controlInvalid('password')"
          [attr.aria-describedby]="passwordHelpId"
        />
        @if (controlInvalid('password')) {
        <small [id]="passwordHelpId">{{ passwordErrorMessage() }}</small>
        }
      </label>

      <label class="login__field">
        <span>{{ t('confirmPassword') }}</span>
        <input
          type="password"
          formControlName="confirmPassword"
          autocomplete="new-password"
          [attr.aria-invalid]="controlInvalid('confirmPassword')"
        />
        @if (controlInvalid('confirmPassword')) {
        <small>{{ confirmErrorMessage() }}</small>
        }
      </label>

      @if (errorMessage()) {
      <p class="login__error" role="alert">{{ errorMessage() }}</p>
      }

      @if (successMessage()) {
      <p class="login__success" role="alert">{{ successMessage() }}</p>
      }

      <div class="login__actions">
        <button type="submit" class="login__primary" [disabled]="submitting() || successMessage()">
          {{ submitting() ? t('resetting') : t('resetPasswordAction') }}
        </button>
      </div>

      <div class="login__meta">
        <a routerLink="/login" class="login__link">
          &larr; {{ t('backToLogin') }}
        </a>
      </div>
    </form>
  </section>
</main>
