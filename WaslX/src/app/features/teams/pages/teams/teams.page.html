<section class="feature-page" [attr.dir]="direction()">
  <header class="feature-page__header">
    <div>
      <span class="feature-page__eyebrow">{{ t('teams') }}</span>
      <h1>{{ t('teamManagement') }}</h1>
    </div>
    <div class="feature-page__actions">
      <button class="feature-page__btn">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
        {{ t('createTeam') }}
      </button>
    </div>
  </header>

  <div class="feature-page__empty">
    <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" /><circle cx="8.5" cy="7" r="4" /><path d="M20 8v6M23 11h-6" /></svg>
    <h3>{{ t('noData') }}</h3>
    <p>{{ t('featureComingSoonDesc') }}</p>
  </div>
</section>
