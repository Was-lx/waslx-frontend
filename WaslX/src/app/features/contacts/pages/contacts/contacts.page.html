<section class="feature-page" [attr.dir]="direction()">
  <header class="feature-page__header">
    <div>
      <span class="feature-page__eyebrow">{{ t('contacts') }}</span>
      <h1>{{ t('contactList') }}</h1>
    </div>
    <div class="feature-page__actions">
      <div class="feature-page__search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" /><path d="m16 16 4.5 4.5" /></svg>
        <input type="search" [placeholder]="t('searchPlaceholder')" />
      </div>
      <button class="feature-page__btn">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
        {{ t('addContact') }}
      </button>
    </div>
  </header>

  <div class="feature-page__empty">
    <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M23 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></svg>
    <h3>{{ t('noData') }}</h3>
    <p>{{ t('featureComingSoonDesc') }}</p>
  </div>
</section>
